name: Backend release checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MIGRATION_DATABASE_URL: postgresql://renewrelay_migrator:local_migrator@127.0.0.1:5432/renewrelay_audit_ci
      DATABASE_URL: postgresql://renewrelay_app:local_app@127.0.0.1:5432/renewrelay_audit_ci
      AUTH_DATABASE_URL: postgresql://renewrelay_auth:local_auth@127.0.0.1:5432/renewrelay_audit_ci
      WORKER_DATABASE_URL: postgresql://renewrelay_worker:local_worker@127.0.0.1:5432/renewrelay_audit_ci
      BETTER_AUTH_URL: http://127.0.0.1:3547
      SMTP_URL: smtp://127.0.0.1:3548
      MAIL_FROM: renewrelay@example.test
      WORKER_POLL_MS: "100"
      RR_TEST_NEXT_MODE: release
      RR_TEST_PG_CONTAINER: renewrelay-ci-postgres
      RENEWRELAY_ENV: local
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "22.20.0"
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run check
      - run: npm audit --audit-level=moderate
      - run: npm run licenses
      - name: Prepare isolated PostgreSQL 18
        run: |
          docker compose up -d --wait postgres
          docker rename "$(docker compose ps -q postgres)" renewrelay-ci-postgres
          docker exec renewrelay-ci-postgres createdb -U renewrelay_migrator renewrelay_audit_ci
          npm run db:deploy
          docker exec -i renewrelay-ci-postgres psql -U renewrelay_migrator -d renewrelay_audit_ci -v ON_ERROR_STOP=1 < packages/db/grant-runtime.sql
      - run: npm run test:migrations
      - run: npm run build:release
      - run: npm ci --omit=dev --omit=peer --ignore-scripts
        working-directory: release
      - name: Test production artifacts and restore
        run: |
          node -e 'const fs=require("node:fs"),c=require("node:crypto");fs.appendFileSync(process.env.GITHUB_ENV,"BETTER_AUTH_SECRET="+c.randomBytes(48).toString("base64url")+"\nINVITE_ENCRYPTION_KEY="+c.randomBytes(32).toString("base64url")+"\n")'
      - run: npm run test:release && npm run test:e2e && npm run test:restore
      - run: npm run test:audit
      - name: Validate infrastructure schema
        run: |
          python -m pip install cfn-lint==1.60.1
          cfn-lint infra/aws/backend.template.json
      - name: Build runtime and migration images
        run: |
          docker build --target runtime -t renewrelay:ci .
          docker build --target migration -t renewrelay-migration:ci .
      - run: RR_RUNTIME_IMAGE=renewrelay:ci RR_MIGRATION_IMAGE=renewrelay-migration:ci npm run test:containers
      - uses: actions/upload-artifact@v4
        with:
          name: backend-contract-and-notices
          path: |
            docs/API_CONTRACT.json
            docs/THIRD_PARTY_NOTICES.txt
            docs/audit/dependency-licenses-batch5-2026-11-18.json
