services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: renewrelay_migrator
      POSTGRES_PASSWORD: local_migrator
      POSTGRES_DB: renewrelay
    ports:
      - "127.0.0.1:${RENEWRELAY_POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./infra/local/create-roles.sh:/docker-entrypoint-initdb.d/create-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U renewrelay_migrator -d renewrelay"]
      interval: 2s
      timeout: 5s
      retries: 20
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
volumes:
  pgdata:
